<title>Studio Twin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#ECEEE9; --surface:rgba(255,255,255,.90); --surface-2:#E0E3DD;
  --ink:#191C19; --ink-2:#4E554E; --ink-3:#79807A; --rule:#CFD4CC;
  --accent:#A8422F; --on-accent:#FFFFFF;
  --good:#2F6B4F;
  --shadow:0 2px 6px rgba(20,24,20,.07), 0 14px 34px rgba(20,24,20,.13);
  --vignette:rgba(28,32,28,.26);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131512; --surface:rgba(28,31,27,.88); --surface-2:#262A25;
    --ink:#E9EBE6; --ink-2:#A8AFA6; --ink-3:#7C837B; --rule:#333830;
    --accent:#DE6A50; --on-accent:#14100E; --good:#6ABF95;
    --shadow:0 2px 6px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.45);
    --vignette:rgba(0,0,0,.42);
  }
}
:root[data-theme="dark"]{
  --ground:#131512; --surface:rgba(28,31,27,.88); --surface-2:#262A25;
  --ink:#E9EBE6; --ink-2:#A8AFA6; --ink-3:#7C837B; --rule:#333830;
  --accent:#DE6A50; --on-accent:#14100E; --good:#6ABF95;
  --shadow:0 2px 6px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.45);
  --vignette:rgba(0,0,0,.42);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
#stage{position:fixed;inset:0;}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
#stage canvas:active{cursor:grabbing;}
#vig{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse 78% 72% at 50% 46%, transparent 42%, var(--vignette) 100%);
}
#boot{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--ground);z-index:50;transition:opacity .5s ease;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
#boot.gone{opacity:0;pointer-events:none;}

.plate{
  position:fixed;top:16px;left:16px;z-index:10;background:var(--surface);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule);border-radius:4px;padding:11px 15px;
  box-shadow:var(--shadow);max-width:calc(100vw - 32px);
}
.plate .eyebrow{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;font-weight:500;letter-spacing:.17em;text-transform:uppercase;
  color:var(--accent);margin:0 0 4px;
}
.plate h1{font-size:17px;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.1;}
.plate .dims{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;color:var(--ink-3);margin:5px 0 0;font-variant-numeric:tabular-nums;
}

#hint{
  position:fixed;top:18px;right:16px;z-index:10;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);text-align:right;line-height:1.9;
  pointer-events:none;text-shadow:0 1px 3px var(--ground);
}
#hint b{color:var(--ink-2);font-weight:500;}

#dock{
  position:fixed;left:16px;bottom:16px;z-index:10;background:var(--surface);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule);border-radius:4px;box-shadow:var(--shadow);
  width:284px;max-height:calc(100vh - 130px);overflow-y:auto;
}
.grp{padding:13px 15px;border-bottom:1px solid var(--rule);}
.grp:last-child{border-bottom:none;}
.grp h2{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;font-weight:500;letter-spacing:.17em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px;
}
.row{display:flex;flex-wrap:wrap;gap:6px;}
button{
  font-family:"Archivo",system-ui,sans-serif;font-size:12.5px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);border:1px solid transparent;
  border-radius:3px;padding:7px 11px;cursor:pointer;line-height:1.2;
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
button:hover{color:var(--ink);background:var(--rule);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.row.stack{flex-direction:column;}
.row.stack button{width:100%;text-align:left;display:flex;align-items:center;gap:9px;}
.dot{
  width:8px;height:8px;border-radius:50%;background:var(--rule);
  border:1px solid rgba(0,0,0,.12);flex:0 0 auto;
  transition:background .18s ease,box-shadow .18s ease;
}
button.on .dot{background:#FFC98A;box-shadow:0 0 9px 1px rgba(255,180,110,.85);border-color:rgba(0,0,0,.2);}
.meta{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.03em;
}
.readout{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  color:var(--ink-3);margin:9px 0 0;line-height:1.7;font-variant-numeric:tabular-nums;
}
.readout b{color:var(--ink-2);font-weight:500;}
.readout .up{color:var(--good);font-weight:500;}
.stats .up{color:var(--good);}
.stats .down{color:var(--accent);}

/* layout stat strip */
.stats{display:flex;gap:0;margin:10px 0 0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;}
.stats div{flex:1;padding:8px 10px;border-right:1px solid var(--rule);}
.stats div:last-child{border-right:none;}
.stats dt{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px;
}
.stats dd{
  margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:13px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;
}
.changes{margin:10px 0 0;padding:0;list-style:none;}
.changes li{
  font-size:11.5px;color:var(--ink-2);line-height:1.5;
  padding:3px 0 3px 14px;position:relative;
}
.changes li::before{
  content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;
  background:var(--accent);
}
.changes li.gone::before{background:var(--ink-3);}
#toggleDock{position:fixed;z-index:11;display:none;}

@media (max-width:760px){
  .plate{top:10px;left:10px;padding:9px 12px;}
  .plate h1{font-size:15px;}
  #hint{display:none;}
  #dock{left:10px;right:10px;bottom:10px;width:auto;max-height:56vh;}
  #dock.hidden{display:none;}
  #toggleDock{display:block;right:10px;bottom:10px;}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}
</style>

<div id="stage"></div>
<div id="vig"></div>
<div id="boot">Building the room…</div>

<div class="plate">
  <p class="eyebrow">Smart room &middot; digital twin</p>
  <h1>Studio Twin</h1>
  <p class="dims">2.80 &times; 5.40 &times; 2.55 m &middot; estimated</p>
</div>

<div id="hint">
  <b>Drag</b> orbit &nbsp;&middot;&nbsp; <b>Scroll</b> zoom<br>
  <b>Right-drag</b> pan
</div>

<div id="dock">
  <div class="grp">
    <h2>Layout</h2>
    <div class="row" id="layouts"></div>
    <dl class="stats">
      <div><dt>Free floor</dt><dd id="statFloor">&mdash;</dd></div>
      <div><dt>Floor pieces</dt><dd id="statWalk">&mdash;</dd></div>
    </dl>
    <ul class="changes" id="changeList"></ul>
  </div>
  <div class="grp">
    <h2>Camera</h2>
    <div class="row" id="views"></div>
  </div>
  <div class="grp">
    <h2>Lighting scene</h2>
    <div class="row" id="scenes"></div>
    <p class="readout" id="sceneReadout"></p>
  </div>
  <div class="grp">
    <h2>Lamps</h2>
    <div class="row stack" id="lamps"></div>
  </div>
  <div class="grp">
    <h2>Reference</h2>
    <div class="row" id="refs"></div>
    <p class="readout">Grid squares are <b>0.5 m</b>.</p>
  </div>
</div>

<button id="toggleDock">Controls</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

if (!window.THREE) {
  document.getElementById('boot').textContent = 'Could not load the 3D library.';
  return;
}

/* ================================================================
   AXES — from the doorway looking toward the window:
   RED accent wall on the LEFT (X = W), bed/desk on the RIGHT (X = 0)
   ================================================================ */
var W = 2.80, L = 5.40, H = 2.55;

var stage = document.getElementById('stage');
var renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(46, stage.clientWidth / stage.clientHeight, 0.05, 100);
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

/* ---------------- image-based lighting ---------------- */
(function buildEnvironment(){
  var c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  var g = c.getContext('2d');
  var grad = g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0.00, '#E6E2D8');
  grad.addColorStop(0.34, '#CFC9BC');
  grad.addColorStop(0.56, '#A9A497');
  grad.addColorStop(1.00, '#7E7C76');
  g.fillStyle = grad; g.fillRect(0,0,512,256);
  var win = g.createRadialGradient(120,118,4,120,118,100);
  win.addColorStop(0.0,'#FFFFFF');
  win.addColorStop(0.45,'rgba(255,252,245,0.80)');
  win.addColorStop(1.0,'rgba(255,250,240,0)');
  g.fillStyle = win; g.fillRect(0,0,512,256);
  var bounce = g.createRadialGradient(372,150,4,372,150,120);
  bounce.addColorStop(0.0,'rgba(176,74,59,0.60)');
  bounce.addColorStop(1.0,'rgba(176,74,59,0)');
  g.fillStyle = bounce; g.fillRect(0,0,512,256);
  var tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
})();

/* ---------------- orbit controls ---------------- */
var ctrl = {
  target:new THREE.Vector3(W/2,1.00,L/2), tTarget:new THREE.Vector3(W/2,1.00,L/2),
  radius:8.0, tRadius:8.0, theta:-2.36, tTheta:-2.36, phi:1.08, tPhi:1.08,
  minR:1.0, maxR:18, minPhi:0.06, maxPhi:1.545
};
function applyCamera(){
  var d = 0.16;
  ctrl.radius += (ctrl.tRadius-ctrl.radius)*d;
  ctrl.theta  += (ctrl.tTheta -ctrl.theta )*d;
  ctrl.phi    += (ctrl.tPhi   -ctrl.phi   )*d;
  ctrl.target.lerp(ctrl.tTarget, d);
  var sp = Math.sin(ctrl.phi), cp = Math.cos(ctrl.phi);
  camera.position.set(
    ctrl.target.x + ctrl.radius*sp*Math.sin(ctrl.theta),
    ctrl.target.y + ctrl.radius*cp,
    ctrl.target.z + ctrl.radius*sp*Math.cos(ctrl.theta)
  );
  camera.lookAt(ctrl.target);
}
(function bindControls(){
  var el = renderer.domElement;
  var dragging=false, mode='rot', lx=0, ly=0, pointers={}, pinchStart=0, pinchR=0;
  function down(e){
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    var n = Object.keys(pointers).length;
    if (n===1){ dragging=true; mode=(e.button===2||e.shiftKey||e.ctrlKey)?'pan':'rot'; lx=e.clientX; ly=e.clientY; }
    else if (n===2){
      dragging=false;
      var k=Object.keys(pointers), a=pointers[k[0]], b=pointers[k[1]];
      pinchStart=Math.hypot(a.x-b.x,a.y-b.y); pinchR=ctrl.tRadius;
    }
  }
  function move(e){
    if (!(e.pointerId in pointers)) return;
    pointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    var keys = Object.keys(pointers);
    if (keys.length===2){
      var a=pointers[keys[0]], b=pointers[keys[1]];
      var dist=Math.hypot(a.x-b.x,a.y-b.y);
      if (pinchStart>0) ctrl.tRadius = clamp(pinchR*(pinchStart/Math.max(dist,1)), ctrl.minR, ctrl.maxR);
      return;
    }
    if (!dragging) return;
    var dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if (mode==='rot'){
      ctrl.tTheta -= dx*0.0062;
      ctrl.tPhi = clamp(ctrl.tPhi - dy*0.0062, ctrl.minPhi, ctrl.maxPhi);
    } else {
      var sc = ctrl.radius*0.0016;
      var right = new THREE.Vector3(Math.cos(ctrl.theta),0,-Math.sin(ctrl.theta));
      var fwd   = new THREE.Vector3(-Math.sin(ctrl.theta),0,-Math.cos(ctrl.theta));
      ctrl.tTarget.addScaledVector(right,-dx*sc);
      ctrl.tTarget.addScaledVector(fwd,  -dy*sc);
      ctrl.tTarget.x = clamp(ctrl.tTarget.x,-3,W+3);
      ctrl.tTarget.z = clamp(ctrl.tTarget.z,-3,L+3);
      ctrl.tTarget.y = clamp(ctrl.tTarget.y,0.1,2.4);
    }
  }
  function up(e){
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length<2) pinchStart=0;
    if (Object.keys(pointers).length===0) dragging=false;
  }
  el.addEventListener('pointerdown',down);
  window.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
  el.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  el.addEventListener('wheel',function(e){
    e.preventDefault();
    ctrl.tRadius = clamp(ctrl.tRadius*Math.pow(1.0016,e.deltaY), ctrl.minR, ctrl.maxR);
  },{passive:false});
})();

/* ================================================================
   TEXTURES
   ================================================================ */
function noiseTexture(px, contrast, repeat){
  var c=document.createElement('canvas'); c.width=c.height=px;
  var g=c.getContext('2d'), img=g.createImageData(px,px);
  for (var i=0;i<px*px;i++){
    var v = 128 + (Math.random()-0.5)*contrast;
    img.data[i*4]=img.data[i*4+1]=img.data[i*4+2]=v; img.data[i*4+3]=255;
  }
  g.putImageData(img,0,0);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat,repeat);
  return t;
}
function softNoiseTexture(px, blobs, alpha, repeat){
  var c=document.createElement('canvas'); c.width=c.height=px;
  var g=c.getContext('2d');
  g.fillStyle='#808080'; g.fillRect(0,0,px,px);
  for (var i=0;i<blobs;i++){
    var r=6+Math.random()*26, x=Math.random()*px, y=Math.random()*px;
    var rg=g.createRadialGradient(x,y,0,x,y,r);
    var shade = Math.random()>0.5 ? '255,255,255' : '0,0,0';
    rg.addColorStop(0,'rgba('+shade+','+alpha+')');
    rg.addColorStop(1,'rgba('+shade+',0)');
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat,repeat);
  return t;
}
function woodTexture(base, rx, ry){
  var cw=64, ch=256, c=document.createElement('canvas');
  c.width=cw; c.height=ch;
  var g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,cw,ch);
  for (var i=0;i<80;i++){
    g.strokeStyle='rgba(88,56,22,'+(Math.random()*0.15)+')';
    g.lineWidth=Math.random()*2.2+0.3;
    var x=Math.random()*cw;
    g.beginPath(); g.moveTo(x,-10);
    g.bezierCurveTo(x+7,85,x-7,170,x+3,ch+10); g.stroke();
  }
  for (var j=0;j<26;j++){
    g.strokeStyle='rgba(255,228,190,'+(Math.random()*0.12)+')';
    g.lineWidth=Math.random()*1.4+0.2;
    var x2=Math.random()*cw;
    g.beginPath(); g.moveTo(x2,-10); g.lineTo(x2+3,ch+10); g.stroke();
  }
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); t.anisotropy=8;
  return t;
}
function tileTexture(){
  var s=256, c=document.createElement('canvas'); c.width=c.height=s;
  var g=c.getContext('2d');
  g.fillStyle='#EAE9E4'; g.fillRect(0,0,s,s);
  for (var i=0;i<1400;i++){
    g.fillStyle='rgba(255,255,255,'+(Math.random()*0.30)+')';
    g.fillRect(Math.random()*s,Math.random()*s,2.5,2.5);
  }
  for (var j=0;j<700;j++){
    g.fillStyle='rgba(190,186,178,'+(Math.random()*0.24)+')';
    g.fillRect(Math.random()*s,Math.random()*s,2,2);
  }
  for (var v=0;v<7;v++){
    g.strokeStyle='rgba(176,172,164,0.10)'; g.lineWidth=1.4;
    var vx=Math.random()*s, vy=Math.random()*s;
    g.beginPath(); g.moveTo(vx,vy);
    g.bezierCurveTo(vx+60,vy+30,vx+20,vy+110,vx+90,vy+150); g.stroke();
  }
  g.strokeStyle='#C5C2BA'; g.lineWidth=4; g.strokeRect(0,0,s,s);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(W/0.6,L/0.6); t.anisotropy=8;
  return t;
}
function posterTexture(){
  var cw=220, ch=290, c=document.createElement('canvas');
  c.width=cw; c.height=ch;
  var g=c.getContext('2d');
  g.fillStyle='#1A1714'; g.fillRect(0,0,cw,ch);
  g.strokeStyle='#C8B89A'; g.lineWidth=2;
  g.beginPath(); g.arc(cw/2,ch*0.44,66,0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(cw/2,ch*0.44,50,0,Math.PI*2); g.stroke();
  g.globalAlpha=0.5;
  for (var i=0;i<28;i++){
    var a=(i/28)*Math.PI*2;
    g.beginPath();
    g.moveTo(cw/2+Math.cos(a)*52, ch*0.44+Math.sin(a)*52);
    g.lineTo(cw/2+Math.cos(a)*64, ch*0.44+Math.sin(a)*64);
    g.stroke();
  }
  g.globalAlpha=1; g.fillStyle='#D8CBB2';
  g.fillRect(cw*0.22,ch*0.74,cw*0.56,3);
  g.fillRect(cw*0.32,ch*0.80,cw*0.36,3);
  return new THREE.CanvasTexture(c);
}

var TEX = {
  fabricBump: noiseTexture(128,150,7),
  clothBump:  softNoiseTexture(256,220,0.26,3),
  wallBump:   softNoiseTexture(256,150,0.10,2),
  wood:       woodTexture('#AB7A41',1,1),
  woodPanel:  woodTexture('#A9763C',2,1)
};

/* ================================================================
   HELPERS
   ================================================================ */
function mat(color,o){
  var p = { color:new THREE.Color(color), roughness:0.88, metalness:0.0, envMapIntensity:0.55 };
  if (o) for (var k in o) p[k]=o[k];
  return new THREE.MeshStandardMaterial(p);
}
var _rboxCache = {};
function roundedBoxGeom(w,h,d,r){
  r = Math.max(0.002, Math.min(r, Math.min(w,h,d)/2 - 0.002));
  var key=[w,h,d,r].map(function(n){return n.toFixed(4);}).join('|');
  if (_rboxCache[key]) return _rboxCache[key];
  var s=new THREE.Shape(), hw=w/2, hh=h/2;
  s.moveTo(-hw,-hh+r);
  s.lineTo(-hw, hh-r); s.quadraticCurveTo(-hw, hh, -hw+r, hh);
  s.lineTo( hw-r, hh); s.quadraticCurveTo( hw, hh,  hw, hh-r);
  s.lineTo( hw,-hh+r); s.quadraticCurveTo( hw,-hh,  hw-r,-hh);
  s.lineTo(-hw+r,-hh); s.quadraticCurveTo(-hw,-hh, -hw,-hh+r);
  var g=new THREE.ExtrudeGeometry(s,{
    depth:Math.max(0.001,d-2*r), bevelEnabled:true, bevelSize:r, bevelThickness:r,
    bevelSegments:3, curveSegments:5, steps:1
  });
  g.translate(0,0,-(d/2-r)); g.computeVertexNormals();
  _rboxCache[key]=g; return g;
}
function rbox(w,h,d,r,material,x,y,z,parent){
  var m=new THREE.Mesh(roundedBoxGeom(w,h,d,r), material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;

function strut(a,b,r,material,parent){
  var A=new THREE.Vector3(a[0],a[1],a[2]), B=new THREE.Vector3(b[0],b[1],b[2]);
  var dir=new THREE.Vector3().subVectors(B,A), len=dir.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.88,len,12), material);
  m.position.copy(A).addScaledVector(dir,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  m.castShadow=true; m.receiveShadow=true;
  (parent||scene).add(m);
  return m;
}

/* ================================================================
   LIGHTING SCENES
   ================================================================ */
function kelvinToColor(k){
  var t=k/100,r,g,b;
  r=(t<=66)?255:329.698727446*Math.pow(t-60,-0.1332047592);
  g=(t<=66)?99.4708025861*Math.log(t)-161.1195681661:288.1221695283*Math.pow(t-60,-0.0755148492);
  b=(t>=66)?255:(t<=19?0:138.5177312231*Math.log(t-10)-305.0447927307);
  return new THREE.Color(clamp(r,0,255)/255,clamp(g,0,255)/255,clamp(b,0,255)/255);
}
var SCENES = {
  day:      { label:'Day',      kelvin:3500,pct:75,sun:1.05,hemi:0.30, hemiSky:0xDCE8F2,hemiGnd:0xC9C4B8,fill:0.12, glass:0.45,bg:0xC6CAC7,env:0.90,exposure:0.88,shadows:false,desc:'Daylight through the window. Lamps on, barely registering.' },
  evening:  { label:'Evening',  kelvin:2700,pct:45,sun:0.07,hemi:0.09, hemiSky:0x2E3948,hemiGnd:0x2A2620,fill:0.03, glass:0.09,bg:0x1A1D20,env:0.18,exposure:1.05,shadows:true, desc:'Sunset warm-down: 2700 K at 45%, faded over five minutes.' },
  midnight: { label:'Midnight', kelvin:2200,pct:20,sun:0.02,hemi:0.045,hemiSky:0x1C232E,hemiGnd:0x231E18,fill:0.015,glass:0.03,bg:0x111316,env:0.10,exposure:1.18,shadows:true, desc:'Door-opens automation after 22:00: 2200 K at 20%.' }
};
var currentScene = 'day';

var stdMaterials = [];
scene.traverse(function(o){
  if (o.material){
    var arr = Array.isArray(o.material) ? o.material : [o.material];
    arr.forEach(function(m){
      if (m.isMeshStandardMaterial && stdMaterials.indexOf(m) === -1){
        m.userData.baseEnv = (m.envMapIntensity === undefined) ? 1 : m.envMapIntensity;
        stdMaterials.push(m);
      }
    });
  }
});

function applyScene(key){
  currentScene = key;
  var s = SCENES[key], col = kelvinToColor(s.kelvin);
  sun.intensity=s.sun; fill.intensity=s.fill; hemi.intensity=s.hemi;
  hemi.color.setHex(s.hemiSky); hemi.groundColor.setHex(s.hemiGnd);
  mGlass.emissiveIntensity=s.glass;
  scene.background=new THREE.Color(s.bg);
  renderer.toneMappingExposure=s.exposure;
  stdMaterials.forEach(function(m){ m.envMapIntensity = m.userData.baseEnv * s.env; });
  Object.keys(lamps).forEach(function(k){
    var lp=lamps[k];
    lp.light.color.copy(col);
    lp.light.intensity = lp.on ? (s.pct/100)*(key==='day'?0.5:2.6) : 0;
    lp.light.castShadow = !!(lp.shadows && s.shadows && lp.on);
    lp.shade.emissive.copy(col);
    lp.shade.emissiveIntensity = lp.on ? (key==='day'?0.20:0.45+(s.pct/100)*0.75) : 0;
  });
  document.getElementById('sceneReadout').innerHTML =
    '<b>'+s.kelvin+' K</b> &middot; <b>'+s.pct+'%</b><br>'+s.desc;
  Array.prototype.forEach.call(document.querySelectorAll('#scenes button'),function(b){
    b.classList.toggle('on', b.dataset.k===key);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#lamps button'),function(b){
    b.classList.toggle('on', lamps[b.dataset.k].on);
  });
}

/* ================================================================
   LAYOUTS
   Floor areas and walkway figures are computed from the same
   footprints the geometry above is built from.
   ================================================================ */
var LAYOUTS = {
  current: {
    label:'Current',
    floor:9.24, pieces:13,
    changes:[]
  },
  proposed: {
    label:'Proposed',
    floor:9.04, pieces:12,
    changes:[
      { t:'TV onto an easel at the foot of the bed — watched head-on, no wall fixing' },
      { t:'Console gone', gone:true },
      { t:'Slat panel becomes the headboard' },
      { t:'Closet on the red wall, clear of the door swing' },
      { t:'Fridge joins the closet as one service run by the door' },
      { t:'Mirror and basket absorbed by the closet', gone:true },
      { t:'Middle of the room left empty' }
    ]
  }
};
var currentLayout = 'current';

function setLayout(key){
  currentLayout = key;
  Object.keys(PIECES).forEach(function(name){
    var p = PIECES[name];
    var l = p.layouts[key] || p.layouts.current;
    p.tp.set(l.p[0], l.p[1], l.p[2]);
    p.tr = l.ry || 0;
    p.tt = l.tilt || 0;
    p.ts = (l.on === false) ? 0.001 : 1;
    if (p.ts === 1) p.group.visible = true;
  });

  var d = LAYOUTS[key];
  var floorTxt = d.floor.toFixed(2) + ' m²';
  if (key === 'proposed'){
    var diff = d.floor - LAYOUTS.current.floor;
    floorTxt += ' <span class="' + (diff >= 0 ? 'up' : 'down') + '">' +
                (diff >= 0 ? '+' : '−') + Math.abs(diff).toFixed(2) + '</span>';
  }
  document.getElementById('statFloor').innerHTML = floorTxt;
  var pieceTxt = String(d.pieces);
  if (key === 'proposed'){
    pieceTxt += ' <span class="up">&minus;' + (LAYOUTS.current.pieces - d.pieces) + '</span>';
  }
  document.getElementById('statWalk').innerHTML = pieceTxt;

  var ul = document.getElementById('changeList');
  ul.innerHTML = '';
  d.changes.forEach(function(c){
    var li = document.createElement('li');
    li.textContent = c.t;
    if (c.gone) li.className = 'gone';
    ul.appendChild(li);
  });

  Array.prototype.forEach.call(document.querySelectorAll('#layouts button'), function(b){
    b.classList.toggle('on', b.dataset.k === key);
  });
}

function tweenPieces(){
  var d = 0.12;
  Object.keys(PIECES).forEach(function(name){
    var p = PIECES[name], g = p.group;
    g.position.lerp(p.tp, d);
    g.rotation.y += (p.tr - g.rotation.y) * d;
    if (p.tiltNode) p.tiltNode.rotation.x += (p.tt - p.tiltNode.rotation.x) * d;
    var s = g.scale.x + (p.ts - g.scale.x) * d;
    g.scale.set(s, s, s);
    g.visible = s > 0.02;
  });
}

function goView(k){
  var v=VIEWS[k], t=v.theta;
  while (t-ctrl.tTheta >  Math.PI) t -= Math.PI*2;
  while (t-ctrl.tTheta < -Math.PI) t += Math.PI*2;
  ctrl.tTheta=t;
  ctrl.tPhi=clamp(v.phi,ctrl.minPhi,ctrl.maxPhi);
  ctrl.tRadius=v.radius;
  ctrl.tTarget.set(v.target[0],v.target[1],v.target[2]);
  Array.prototype.forEach.call(document.querySelectorAll('#views button'),function(b){
    b.classList.toggle('on', b.dataset.k===k);
  });
}
function mkButtons(host, obj, onClick){
  Object.keys(obj).forEach(function(k){
    var b=document.createElement('button');
    b.textContent=obj[k].label; b.dataset.k=k;
    b.addEventListener('click',function(){ onClick(k); });
    host.appendChild(b);
  });
}

/* ================================================================
   LOOP
   ================================================================ */
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
}
window.addEventListener('resize',resize);
function tick(){
  requestAnimationFrame(tick);
  applyCamera();
  tweenPieces();
  renderer.render(scene,camera);
}

// seed every piece at its current-layout transform so nothing flies in
setLayout('current');
Object.keys(PIECES).forEach(function(n){
  var p=PIECES[n];
  p.group.position.copy(p.tp);
  p.group.rotation.y=p.tr;
  p.group.scale.setScalar(p.ts);
  p.group.visible = p.ts > 0.02;
});
goView('overview');
applyScene('day');
resize();
tick();

setTimeout(function(){
  var boot=document.getElementById('boot');
